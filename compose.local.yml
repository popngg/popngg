services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: popngg
      MYSQL_USER: popngg
      MYSQL_PASSWORD: local-popngg-password
      MYSQL_ROOT_PASSWORD: local-root-password
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - local-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  local-db-data:
