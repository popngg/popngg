services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: popngg
      MYSQL_USER: popngg
      MYSQL_PASSWORD: local-popngg-password
      MYSQL_ROOT_PASSWORD: local-root-password
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - local-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  loki-init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 10001:10001 /loki"]
    volumes:
      - local-loki-data:/loki
    restart: "no"

  loki:
    image: grafana/loki:3.7.3
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./deploy/monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - local-loki-data:/loki
    depends_on:
      loki-init:
        condition: service_completed_successfully

  alloy:
    image: grafana/alloy:v1.12.0
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./deploy/monitoring/alloy/config-local.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/popngg:ro
      - local-alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started

volumes:
  local-db-data:
  local-loki-data:
  local-alloy-data:
