services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: popngg
      MYSQL_USER: popngg
      MYSQL_PASSWORD: local-popngg-password
      MYSQL_ROOT_PASSWORD: local-root-password
      TZ: UTC
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - local-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30

  loki:
    image: grafana/loki:3.4.0
    command:
      - -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - local-loki-data:/loki

  promtail:
    image: grafana/promtail:3.4.0
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./deploy/monitoring/promtail/config-local.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/popngg:ro
    depends_on:
      - loki

volumes:
  local-db-data:
  local-loki-data:
