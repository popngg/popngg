services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: popngg
      MYSQL_USER: popngg
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=TCP -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - db-data:/var/lib/mysql

  migration:
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/popngg?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: popngg
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      JWT_ISSUER: ${JWT_ISSUER:-popngg}
      POPNGG_AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      GAME_CURRENT_VERSION: ${GAME_CURRENT_VERSION:-29}
      RENEWAL_COLLECTOR_VERSION: ${RENEWAL_COLLECTOR_VERSION:-1}
      RENEWAL_GAME: ${RENEWAL_GAME:-popn29}
      SPRING_FLYWAY_ENABLED: "true"
    command:
      - --spring.main.web-application-type=none
      - --spring.flyway.enabled=true
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  catalog-migration:
    image: mysql:8.0
    environment:
      MYSQL_PWD: ${DB_PASSWORD:?DB_PASSWORD is required}
    command:
      - sh
      - -c
      - >-
        set -eu;
        mysql --protocol=TCP --host=mysql --user=popngg
        --default-character-set=utf8mb4 --show-warnings popngg
        --execute="CREATE TABLE IF NOT EXISTS catalog_data_migrations (
        migration_key VARCHAR(128) PRIMARY KEY, applied_at DATETIME NOT NULL)";
        if ! mysql --protocol=TCP --host=mysql --user=popngg
        --default-character-set=utf8mb4 --show-warnings popngg
        --batch --skip-column-names
        --execute="SELECT 1 FROM catalog_data_migrations
        WHERE migration_key = 'popn29-v3-catalog-20260821'" | grep -qx 1; then
        mysql --protocol=TCP --host=mysql --user=popngg
        --default-character-set=utf8mb4 --show-warnings popngg < /confirmed-deletions.sql;
        mysql --protocol=TCP --host=mysql --user=popngg
        --default-character-set=utf8mb4 --show-warnings popngg < /existing-song-updates.sql;
        mysql --protocol=TCP --host=mysql --user=popngg
        --default-character-set=utf8mb4 --show-warnings popngg < /new-songs-and-charts.sql;
        mysql --protocol=TCP --host=mysql --user=popngg
        --default-character-set=utf8mb4 --show-warnings popngg
        --execute="INSERT INTO catalog_data_migrations
        (migration_key, applied_at) VALUES
        ('popn29-v3-catalog-20260821', CURRENT_TIMESTAMP)";
        fi;
        if ! mysql --protocol=TCP --host=mysql --user=popngg
        --default-character-set=utf8mb4 --show-warnings popngg
        --batch --skip-column-names
        --execute="SELECT 1 FROM catalog_data_migrations
        WHERE migration_key = 'popn29-v4-levels-20260822'" | grep -qx 1; then
        mysql --protocol=TCP --host=mysql --user=popngg
        --default-character-set=utf8mb4 --show-warnings popngg < /popn29-level-changes.sql;
        mysql --protocol=TCP --host=mysql --user=popngg
        --default-character-set=utf8mb4 --show-warnings popngg
        --execute="INSERT INTO catalog_data_migrations
        (migration_key, applied_at) VALUES
        ('popn29-v4-levels-20260822', CURRENT_TIMESTAMP)";
        fi;
    volumes:
      - ./sql/apply_confirmed_deletions.sql:/confirmed-deletions.sql:ro
      - ./sql/apply_existing_song_updates.sql:/existing-song-updates.sql:ro
      - ./sql/apply_new_songs_and_charts.sql:/new-songs-and-charts.sql:ro
      - ./sql/apply_popn29_level_changes.sql:/popn29-level-changes.sql:ro
    depends_on:
      mysql:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: "no"

  api:
    image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/popngg?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: popngg
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-24}
      JWT_ISSUER: ${JWT_ISSUER:-popngg}
      POPNGG_AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://popn.gg,https://www.popn.gg}
      GAME_CURRENT_VERSION: ${GAME_CURRENT_VERSION:-29}
      RENEWAL_COLLECTOR_VERSION: ${RENEWAL_COLLECTOR_VERSION:-1}
      RENEWAL_GAME: ${RENEWAL_GAME:-popn29}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
      DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      DISCORD_ADMIN_ROLE_ID: ${DISCORD_ADMIN_ROLE_ID:-}
      DISCORD_ADMIN_WEBHOOK_URL: ${DISCORD_ADMIN_WEBHOOK_URL:-}
      DISCORD_ERROR_WEBHOOK_URL: ${DISCORD_ERROR_WEBHOOK_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_JACKET_PREFIX: ${AWS_S3_JACKET_PREFIX:-static}
      AWS_S3_AVATAR_PREFIX: ${AWS_S3_AVATAR_PREFIX:-avatars}
      AWS_CLOUDFRONT_URL: ${AWS_CLOUDFRONT_URL:-https://static.popn.gg}
      SERVER_MAX_SWALLOW_SIZE: ${SERVER_MAX_SWALLOW_SIZE:-4MB}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      MANAGEMENT_PORT: 9091
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      catalog-migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9091/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  adminer:
    image: adminer:4.8.1-standalone
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
