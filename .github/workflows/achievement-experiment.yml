name: Achievement experiment
on:
  pull_request:
    paths:
      - 'analysis/achievement/**'
      - '.github/workflows/achievement-experiment.yml'
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r analysis/achievement/requirements.txt
      - run: python -m unittest discover -s analysis/achievement -p 'test_*.py'
