name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request flow
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          case "$BASE_BRANCH" in
            develop)
              [[ "$HEAD_BRANCH" == feature/* || "$HEAD_BRANCH" == hotfix/* || "$HEAD_BRANCH" == chore/* ]] || {
                echo "PRs into develop must come from feature/**, hotfix/**, or chore/**." >&2
                exit 1
              }
              ;;
            main)
              [[ "$HEAD_BRANCH" == develop ]] || {
                echo "PRs into main must come from develop." >&2
                exit 1
              }
              ;;
            *)
              echo "Unsupported target branch: $BASE_BRANCH" >&2
              exit 1
              ;;
          esac

  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate deployment manifests
      env:
        IMAGE_REPOSITORY: popngg-api
        IMAGE_TAG: ci-validation
        DB_PASSWORD: ci-password
        DB_ROOT_PASSWORD: ci-root-password
        JWT_SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnopqrstuvwxyz-ABCDE
        SWAGGER_USERNAME: ci-swagger-admin
        SWAGGER_PASSWORD: ci-only-swagger-password
        GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password
      run: |
        set -euo pipefail
        bash -n deploy/bin/deploy.sh
        bash -n deploy/bin/smoke-test.sh
        python3 -m unittest discover -s deploy/tests -p 'test_*.py'
        docker compose -f deploy/compose.yml config >/dev/null
        docker compose -f deploy/compose.yml -f deploy/compose.monitoring.yml config >/dev/null
        python3 - <<'PY'
        import re
        from pathlib import Path

        deletions = Path('deploy/sql/apply_confirmed_deletions.sql').read_text()
        delete_ids = re.search(
            r"UPDATE charts.*?WHERE chart_id IN \((.*?)\);", deletions, re.DOTALL
        ).group(1)
        if len(re.findall(r'\d+', delete_ids)) != 60:
            raise SystemExit('expected 60 deleted chart IDs')

        existing = Path('deploy/sql/apply_existing_song_updates.sql').read_text()
        if existing.count(') CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;') < 1:
            raise SystemExit('existing-song staging table collation is not pinned')
        existing_values = existing.split(
            'INSERT INTO existing_song_updates VALUES', 1
        )[1].split('CREATE TEMPORARY TABLE migration_assertions', 1)[0]
        if len(re.findall(r"^\('[0-9]+'", existing_values, re.MULTILINE)) != 1953:
            raise SystemExit('expected 1953 existing song updates')

        new = Path('deploy/sql/apply_new_songs_and_charts.sql').read_text()
        if new.count(') CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;') < 2:
            raise SystemExit('new-song staging table collations are not pinned')
        new_values = new.split('INSERT INTO new_song_catalog VALUES', 1)[1].split(
            'CREATE TEMPORARY TABLE migration_assertions', 1
        )[0]
        if len(re.findall(r"^\('[0-9a-f]{64}'", new_values, re.MULTILINE)) != 108:
            raise SystemExit('expected 108 new songs')
        if "staged_new_charts FROM new_chart_catalog" not in new:
            raise SystemExit('new chart verification is missing')

        levels = Path('deploy/sql/apply_popn29_level_changes.sql').read_text()
        level_values = levels.split(
            'INSERT INTO popn29_level_updates VALUES', 1
        )[1].split('CREATE TEMPORARY TABLE popn29_level_assertions', 1)[0]
        if len(re.findall(r"^\([0-9]+,", level_values, re.MULTILINE)) != 91:
            raise SystemExit('expected 91 popn29 level updates')
        if len(set(re.findall(r"^\(([0-9]+),", level_values, re.MULTILINE))) != 91:
            raise SystemExit('popn29 level update chart IDs must be unique')
        if "COUNT(*) = 91 AND SUM(c.level = u.new_level) = 91" not in levels:
            raise SystemExit('popn29 level verification is missing')

        compose = Path('deploy/compose.yml').read_text()
        if "popn29-v3-catalog-20260821" not in compose:
            raise SystemExit('catalog migration history key is missing')
        if "popn29-v4-levels-20260822" not in compose:
            raise SystemExit('popn29 level migration history key is missing')

        monitoring = Path('deploy/compose.monitoring.yml').read_text()
        if 'grafana/promtail' in monitoring or 'promtail:' in monitoring:
            raise SystemExit('the EOL Promtail collector must not be used')
        if 'alloy-data:/var/lib/alloy/data' not in monitoring:
            raise SystemExit('Alloy positions storage must be persistent')
        if 'loki-init:' not in monitoring or 'chown -R 10001:10001 /loki' not in monitoring:
            raise SystemExit('Loki data volume ownership initialization is missing')
        if 'wget --no-verbose --tries=1 --spider http://127.0.0.1:3100/ready' in monitoring:
            raise SystemExit('the distroless Loki image cannot run a shell/wget healthcheck')

        loki = Path('deploy/monitoring/loki/config.yml').read_text()
        required_loki_settings = (
            'store: tsdb',
            'period: 24h',
            'retention_period: 168h',
            'retention_enabled: true',
            'delete_request_store: filesystem',
        )
        if any(setting not in loki for setting in required_loki_settings):
            raise SystemExit('Loki TSDB retention configuration is incomplete')

        prod = Path('popngg-api/src/main/resources/application-prod.yml').read_text()
        if 'logging.file' in prod or '/var/log/popngg' in prod:
            raise SystemExit('prod profile must not force migration jobs to write API logs')
        if 'api-logs-init' not in compose or 'LOGGING_FILE_NAME' not in compose:
            raise SystemExit('API log volume initialization or API-only logging is missing')
        PY
    
    - name: Build with Gradle
      run: ./gradlew build -x test
    
    - name: Run tests with coverage (Testcontainers MySQL 8)
      run: ./gradlew test jacocoTestReport
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: '**/build/reports/jacoco/test/jacocoTestReport.xml'
        retention-days: 7
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/build/test-results/test/*.xml'
        retention-days: 7
    
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: '**/build/reports/tests/test/'
        retention-days: 7

  pr-coverage-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download coverage reports
      uses: actions/download-artifact@v4
      with:
        name: coverage-reports
        path: coverage-reports
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install diff-cover
      run: pip install diff-cover[jenkins]
    
    - name: Diff Coverage Check
      env:
        COMPARE_BRANCH: origin/${{ github.base_ref || github.ref_name }}
      run: |
        set -euo pipefail

        mapfile -t reports < <(
          find coverage-reports -name "jacocoTestReport.xml" -type f -print | sort
        )

        if [ "${#reports[@]}" -eq 0 ]; then
          echo "No JaCoCo XML reports found."
          exit 1
        fi

        diff-cover \
          "${reports[@]}" \
          --fail-under=80 \
          --compare-branch="$COMPARE_BRANCH" \
          --src-roots \
            popngg-api/src/main/java \
            popngg-application/src/main/java \
            popngg-domain/src/main/java \
            popngg-infra/src/main/java
