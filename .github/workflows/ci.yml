name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew build -x test
    
    - name: Run tests with coverage
      run: ./gradlew test jacocoTestReport
    
    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: '**/build/reports/jacoco/test/jacocoTestReport.xml'
        retention-days: 7
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: '**/build/test-results/test/*.xml'
        retention-days: 7
    
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: '**/build/reports/tests/test/'
        retention-days: 7

  pr-coverage-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download coverage reports
      uses: actions/download-artifact@v4
      with:
        name: coverage-reports
        path: coverage-reports
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Install diff-cover
      run: pip install diff-cover[jenkins]
    
    - name: Diff Coverage Check
      run: |
        set -euo pipefail

        mapfile -t reports < <(
          find coverage-reports -name "jacocoTestReport.xml" -type f -print | sort
        )

        if [ "${#reports[@]}" -eq 0 ]; then
          echo "No JaCoCo XML reports found."
          exit 1
        fi

        diff-cover \
          "${reports[@]}" \
          --fail-under=80 \
          --compare-branch=origin/main \
          --src-roots \
            popngg-api/src/main/java \
            popngg-application/src/main/java \
            popngg-domain/src/main/java \
            popngg-infra/src/main/java
