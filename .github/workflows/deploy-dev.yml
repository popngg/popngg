name: Deploy candidate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: Deployment action
        required: true
        type: choice
        options:
          - rollback-main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: dev

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY"
          test -n "$SSH_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/dev_deploy
          chmod 600 ~/.ssh/dev_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Select deployment revision
        id: revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo "ref=origin/main" >> "$GITHUB_OUTPUT"
            echo "reason=manual rollback to main" >> "$GITHUB_OUTPUT"
          else
            test -n "$CANDIDATE_SHA"
            echo "ref=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
            echo "reason=develop candidate" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy selected revision
        id: deploy_candidate
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
          DEPLOY_REF: ${{ steps.revision.outputs.ref }}
          DEPLOY_REASON: ${{ steps.revision.outputs.reason }}
        run: |
          set -euo pipefail
          test -n "$DEV_HOST"
          test -n "$DEV_USER"
          test -n "$DEPLOY_REF"
          echo "Deploying $DEPLOY_REASON: $DEPLOY_REF"
          ssh -i ~/.ssh/dev_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            "$DEV_USER@$DEV_HOST" \
            "bash -s -- '$DEPLOY_REF'" <<'REMOTE'
          set -euo pipefail
          deploy_ref=$1
          cd "$HOME/popngg"
          git fetch origin main develop
          deploy_sha=$(git rev-parse "$deploy_ref^{commit}")
          git switch --detach "$deploy_sha"
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$deploy_sha/" .env
          else
            printf 'IMAGE_TAG=%s\n' "$deploy_sha" >> .env
          fi
          ./deploy/bin/build-image.sh
          ./deploy/bin/deploy.sh
          REMOTE
      - name: Open release pull request
        if: >-
          success() &&
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_branch == 'develop'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          release_body=$(cat <<EOF
          ## 배포 검증

          \`develop\` 커밋 \`$DEPLOY_SHA\`의 후보 배포와 자동 헬스체크가 성공했습니다.

          실제 기능을 확인하고 필수 승인과 검사를 완료한 뒤 이 PR을 병합하여 현재 버전을 안정 버전으로 확정합니다.

          ## 병합 방식

          이 릴리스 PR은 반드시 **Create a merge commit**으로 병합해야 합니다. main Ruleset이 squash와 rebase 병합을 차단합니다. develop과 main의 계보를 유지하기 위해 이 PR에서는 **Squash and merge를 사용하지 마세요.**
          EOF
          )
          existing_url=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head develop \
            --state open \
            --json url \
            --jq '.[0].url // empty')

          if [[ -n "$existing_url" ]]; then
            gh pr edit "$existing_url" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Release develop to main" \
              --body "$release_body"
            echo "Release PR already exists: $existing_url"
            exit 0
          fi

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head develop \
            --title "Release develop to main" \
            --body "$release_body"

      - name: Restore stable main after failed candidate
        if: >-
          failure() &&
          steps.deploy_candidate.outcome == 'failure' &&
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.head_branch == 'develop'
        env:
          DEV_HOST: ${{ secrets.DEV_HOST }}
          DEV_USER: ${{ secrets.DEV_USER }}
        run: |
          set -euo pipefail
          echo "Candidate deployment failed; restoring origin/main."
          ssh -i ~/.ssh/dev_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=20 \
            -o TCPKeepAlive=yes \
            "$DEV_USER@$DEV_HOST" \
            "bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/popngg"
          git fetch origin main
          stable_sha=$(git rev-parse 'origin/main^{commit}')
          git switch --detach "$stable_sha"
          if grep -q '^IMAGE_TAG=' .env; then
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$stable_sha/" .env
          else
            printf 'IMAGE_TAG=%s\n' "$stable_sha" >> .env
          fi
          ./deploy/bin/build-image.sh
          ./deploy/bin/deploy.sh
          REMOTE
