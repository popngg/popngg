name: GitHub notifications

on:
  pull_request:
    types: [opened, reopened, closed]
  workflow_run:
    workflows: [CI, Deploy candidate]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send GitHub event to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_PR_WEBHOOK_URL }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_JSON: ${{ toJson(github.event) }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_PR_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            action=$(jq -r '.action' <<<"$EVENT_JSON")
            merged=$(jq -r '.pull_request.merged' <<<"$EVENT_JSON")
            number=$(jq -r '.number' <<<"$EVENT_JSON")
            title=$(jq -r '.pull_request.title' <<<"$EVENT_JSON")
            url=$(jq -r '.pull_request.html_url' <<<"$EVENT_JSON")
            actor=$(jq -r '.sender.login' <<<"$EVENT_JSON")
            state="$action"
            if [ "$merged" = "true" ]; then state="merged"; fi
            printf -v content '**[GitHub PR]** #%s %s\n제목: %s\n작업자: %s\n%s' \
              "$number" "$state" "$title" "$actor" "$url"
          else
            workflow=$(jq -r '.workflow_run.name' <<<"$EVENT_JSON")
            conclusion=$(jq -r '.workflow_run.conclusion' <<<"$EVENT_JSON")
            branch=$(jq -r '.workflow_run.head_branch' <<<"$EVENT_JSON")
            sha=$(jq -r '.workflow_run.head_sha[0:7]' <<<"$EVENT_JSON")
            url=$(jq -r '.workflow_run.html_url' <<<"$EVENT_JSON")
            printf -v content '**[GitHub Actions]** %s: %s\n브랜치: %s\n커밋: %s\n%s' \
              "$workflow" "$conclusion" "$branch" "$sha" "$url"
          fi
          jq -n --arg content "$content" \
            '{content: $content, allowed_mentions: {parse: []}}' |
            curl --fail --silent --show-error -H 'Content-Type: application/json' -d @- "$WEBHOOK_URL"
