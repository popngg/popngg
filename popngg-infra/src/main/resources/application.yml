spring:
  jackson:
    time-zone: UTC
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  issuer: ${JWT_ISSUER:popngg}

popngg:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
  swagger:
    username: ${SWAGGER_USERNAME:admin}
    password: ${SWAGGER_PASSWORD:change-me}
  game:
    current-version: ${GAME_CURRENT_VERSION:29}
  renewal:
    collector-version: ${RENEWAL_COLLECTOR_VERSION:1}
    game: ${RENEWAL_GAME:popn29}
  discord:
    application-id: ${DISCORD_APPLICATION_ID:}
    public-key: ${DISCORD_PUBLIC_KEY:}
    bot-token: ${DISCORD_BOT_TOKEN:}
    guild-id: ${DISCORD_GUILD_ID:}
    admin-role-id: ${DISCORD_ADMIN_ROLE_ID:}
    admin-webhook-url: ${DISCORD_ADMIN_WEBHOOK_URL:}
    error-webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}
  jacket:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:}
    prefix: ${AWS_S3_JACKET_PREFIX:static}
    public-url: ${AWS_CLOUDFRONT_URL:https://static.popn.gg}
  avatar:
    bucket: ${AWS_S3_BUCKET:}
    storage-root: ${AWS_S3_JACKET_PREFIX:static}
    prefix: ${AWS_S3_AVATAR_PREFIX:avatars}
    public-url: ${AWS_CLOUDFRONT_URL:https://static.popn.gg}
