spring:
  config:
    activate:
      on-profile: local
  
  docker:
    compose:
      file: ${LOCAL_COMPOSE_FILE:compose.local.yml}
      lifecycle-management: start-and-stop

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/popngg?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:popngg}
    password: ${SPRING_DATASOURCE_PASSWORD:local-popngg-password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
        jdbc:
          lob:
            non_contextual_creation: true

# Logging
logging:
  file:
    name: ./logs/application.log
  structured:
    format:
      console: logstash
      file: logstash
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Server
server:
  port: 8080
  tomcat:
    max-swallow-size: 4MB
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# JWT properties for local
jwt:
  secret-key: ${JWT_SECRET_KEY:local-only-development-key-change-before-production-0123456789abcdef}
  expiration-hours: 24
  issuer: popngg

# Application properties
app:
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000"

management:
  server:
    port: ${MANAGEMENT_PORT:9091}
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      group:
        public:
          include: "*"
          additional-path: server:/health
          show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s,5s
